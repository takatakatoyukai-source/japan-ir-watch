<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日本株IRウォッチ</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#edf4ff;background:#0b1422}*{box-sizing:border-box}body{margin:0}header{padding:25px 18px;background:#152842}.wrap{max-width:820px;margin:auto;padding:16px}h1{font-size:24px;margin:0}h2{font-size:19px;margin-top:28px}.card{background:#162940;border:1px solid #334c69;border-radius:14px;padding:16px;margin:12px 0}.note{background:#26394f;padding:14px;border-radius:12px;line-height:1.7}.form{display:flex;gap:8px}input,textarea{background:#0d1c2d;color:white;border:1px solid #5a7798;border-radius:9px;padding:12px;font:inherit;min-width:0}input{flex:1;width:100%}textarea{width:100%}button,.btn{background:#3377e3;color:white;border:0;border-radius:9px;padding:11px 14px;font:inherit;font-weight:600;text-decoration:none;display:inline-block;cursor:pointer}.secondary{background:#2d445e}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.muted{color:#b4c9dc;font-size:13px}.stock{margin:12px 0}#message{min-height:24px;color:#a6d4ff}a{color:#a8ccff}</style></head><body><header><div class="wrap"><h1>📡 日本株IRウォッチ</h1><div class="muted">無料版｜監視リストと公式情報リンク</div></div></header><main class="wrap"><div class="note">利用状態：監視リスト管理が可能。<br>※IR自動取得・自動通知・株価自動更新は未対応です。</div><div class="card">登録銘柄数：<strong id="count">2</strong><div class="muted" id="clock"></div></div><h2>重点監視銘柄</h2><div class="card"><label for="code">証券コード（4桁）</label><div class="form"><input id="code" type="text" inputmode="numeric" maxlength="4" placeholder="例：6768"><button id="add" type="button">追加</button></div><p id="message" role="status"></p><div class="muted">登録内容はこのブラウザに保存されます。</div></div><div id="watch"><div class="card stock"><strong>タムラ製作所（6768）</strong></div><div class="card stock"><strong>TOWA（6315）</strong></div></div><h2>公式情報を確認</h2><div class="card"><div class="actions"><a class="btn" href="https://www.release.tdnet.info/inbs/I_main_00.html" target="_blank" rel="noopener">TDnet ↗</a><a class="btn secondary" href="https://disclosure2.edinet-fsa.go.jp/" target="_blank" rel="noopener">EDINET ↗</a><a class="btn secondary" href="https://www.jpx.co.jp/" target="_blank" rel="noopener">JPX ↗</a></div></div><h2>確認メモ</h2><div class="card"><textarea id="memo" rows="5" placeholder="IRや需給のメモ"></textarea><div class="actions"><button id="saveMemo" type="button">メモを保存</button><button id="export" type="button" class="secondary">登録内容をバックアップ</button></div></div><p class="muted">株価や開示情報はリンク先の公式情報をご確認ください。</p></main><script>
(function(){
'use strict';
var KEY='japan-ir-watch-static-v2';
var initial=[{code:'6768',name:'タムラ製作所'},{code:'6315',name:'TOWA'}];
var state={stocks:initial.slice(),memo:''};
var el=function(id){return document.getElementById(id)};
try{var saved=localStorage.getItem(KEY);if(saved){var parsed=JSON.parse(saved);if(parsed&&Array.isArray(parsed.stocks)){state.stocks=parsed.stocks.filter(function(x){return x&&/^\d{4}$/.test(String(x.code))});state.memo=String(parsed.memo||'')}}}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){return false}}
function show(msg){el('message').textContent=msg}
function makeButton(label,cls,fn){var b=document.createElement('button');b.type='button';b.textContent=label;if(cls)b.className=cls;b.addEventListener('click',fn);return b}
function makeLink(label,url){var a=document.createElement('a');a.className='btn secondary';a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=label;return a}
function render(){el('count').textContent=String(state.stocks.length);el('clock').textContent='表示時刻：'+new Date().toLocaleString('ja-JP');var list=el('watch');list.replaceChildren();if(!state.stocks.length){var empty=document.createElement('div');empty.className='card';empty.textContent='登録銘柄はありません';list.appendChild(empty)}state.stocks.forEach(function(s){var card=document.createElement('div');card.className='card stock';var title=document.createElement('strong');title.textContent=(s.name||'名称未設定')+'（'+s.code+'）';card.appendChild(title);var actions=document.createElement('div');actions.className='actions';actions.appendChild(makeLink('Yahoo!株価 ↗','https://finance.yahoo.co.jp/quote/'+s.code+'.T'));actions.appendChild(makeLink('公式IRを探す ↗','https://www.google.com/search?q='+encodeURIComponent(s.code+' '+s.name+' IR 公式')));actions.appendChild(makeButton('名称変更','secondary',function(){var name=prompt('銘柄名を入力',s.name||'');if(name===null)return;s.name=name.trim();persist();render()}));actions.appendChild(makeButton('削除','secondary',function(){if(!confirm(s.code+' を削除しますか？'))return;state.stocks=state.stocks.filter(function(x){return x!==s});persist();render();show('削除しました')}));card.appendChild(actions);list.appendChild(card)})}
el('add').addEventListener('click',function(){var code=el('code').value.trim();if(!/^\d{4}$/.test(code)){show('証券コードは4桁で入力してください');return}if(state.stocks.some(function(s){return s.code===code})){show(code+' は登録済みです');return}var name=prompt('銘柄名を入力（空欄でも可）','');if(name===null)name='';state.stocks.push({code:code,name:name.trim()});var ok=persist();el('code').value='';render();show(ok?'登録しました：'+code:'追加しましたが端末に保存できませんでした')});
el('memo').value=state.memo;el('saveMemo').addEventListener('click',function(){state.memo=el('memo').value;alert(persist()?'メモを保存しました':'端末に保存できませんでした')});el('export').addEventListener('click',function(){state.memo=el('memo').value;var a=document.createElement('a');var url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.href=url;a.download='ir-watch-backup.json';a.click();setTimeout(function(){URL.revokeObjectURL(url)},1000)});render();
})();
</script></body></html>
